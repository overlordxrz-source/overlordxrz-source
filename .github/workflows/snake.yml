name: snake

on:
  schedule:
    - cron: "0 7 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/snake.yml"]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg?palette=github-light&color_snake=#111111&color_dots=#ebedf0,#cfcfcf,#9a9a9a,#5e5e5e,#222222
            dist/snake-dark.svg?palette=github-dark&color_snake=#e8e8e8&color_dots=#161b22,#2f2f2f,#5a5a5a,#9a9a9a,#e0e0e0
      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
